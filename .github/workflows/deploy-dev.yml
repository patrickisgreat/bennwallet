name: Deploy to Development

on:
  push:
    branches: [dev]

env:
  DO_APP_ID: ${{ secrets.DO_APP_ID_DEV }}

jobs:
  run-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Wait for deployment to complete
        run: |
          echo "Waiting for Digital Ocean automatic deployment to complete..."
          # Wait for 30 seconds to give DO time to start the deployment
          sleep 30
          
          # Check deployment status every 10 seconds
          for i in {1..12}; do
            DEPLOYMENTS=$(doctl apps list-deployments ${{ env.DO_APP_ID }} --format ID,Status,Progress --no-header)
            echo "Current deployments: $DEPLOYMENTS"
            
            if [[ $DEPLOYMENTS == *"ACTIVE"* ]]; then
              echo "Deployment is active"
              break
            elif [[ $i -eq 12 ]]; then
              echo "Waited 2 minutes, continuing anyway"
            else
              echo "Waiting for deployment to complete, checking again in 10 seconds..."
              sleep 10
            fi
          done
      
      - name: Run database migrations
        run: |
          echo "Running database migrations on development..."
          doctl apps create-deployment-proxy-exec ${{ env.DO_APP_ID }} --component-name api << 'EOF'
            ./bennwallet migrate
          EOF
