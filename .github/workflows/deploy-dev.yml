name: Deploy to Development

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_DEV_APP_NAME: 'bennwallet-dev'
  FLY_DEV_DB_NAME: 'bennwallet-dev-db'
  VOLUME_NAME: 'bennwallet_dev_data'

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        env:
          VITE_API_URL: 'https://${{ env.FLY_DEV_APP_NAME }}.fly.dev'
          NODE_ENV: 'development'
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Debug - Display app and volume names
        run: |
          echo "App Name: ${{ env.FLY_DEV_APP_NAME }}"
          echo "DB Name: ${{ env.FLY_DEV_DB_NAME }}"
          echo "Volume Name: ${{ env.VOLUME_NAME }}"

      - name: Check if app exists
        id: check-app
        continue-on-error: true
        run: |
          flyctl apps list | grep "${{ env.FLY_DEV_APP_NAME }}" || echo "App does not exist yet"
          if flyctl apps list | grep -q "${{ env.FLY_DEV_APP_NAME }}"; then
            echo "APP_EXISTS=true" >> $GITHUB_ENV
          else
            echo "APP_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create app if it doesn't exist
        if: env.APP_EXISTS == 'false'
        run: |
          flyctl apps create "${{ env.FLY_DEV_APP_NAME }}" --org personal

      # Set up PostgreSQL using a regular Fly app
      - name: Check if Postgres app exists
        id: check-db
        continue-on-error: true
        run: |
          if flyctl apps list | grep -q "${{ env.FLY_DEV_DB_NAME }}"; then
            echo "DB_EXISTS=true" >> $GITHUB_ENV
            echo "Postgres app ${{ env.FLY_DEV_DB_NAME }} exists"
          else
            echo "DB_EXISTS=false" >> $GITHUB_ENV
            echo "Postgres app ${{ env.FLY_DEV_DB_NAME }} does not exist"
          fi

      - name: Create Postgres app if it doesn't exist
        if: env.DB_EXISTS == 'false'
        id: create-db
        run: |
          echo "Creating Postgres app ${{ env.FLY_DEV_DB_NAME }}..."
          # Create directory for Postgres app
          mkdir -p postgres-app
          cd postgres-app
          
          # Create fly.toml for the Postgres app
          cat > fly.toml << EOF
          app = "${{ env.FLY_DEV_DB_NAME }}"
          primary_region = "lax"
          
          [env]
            POSTGRES_USER = "postgres"
            POSTGRES_PASSWORD = "${{ secrets.DB_PASSWORD || 'postgres' }}"
            POSTGRES_DB = "bennwallet"
          
          [http_service]
            internal_port = 5432
            force_https = true
            auto_stop_machines = true
            auto_start_machines = true
            min_machines_running = 0
          
          [[vm]]
            memory = "1gb"
            cpu_kind = "shared"
            cpus = 1
          
          [[mounts]]
            source = "pg_data"
            destination = "/var/lib/postgresql/data"
          EOF
          
          # Create Dockerfile for Postgres
          cat > Dockerfile << EOF
          FROM postgres:14-alpine
          
          # Add initialization scripts if needed
          # COPY init.sql /docker-entrypoint-initdb.d/
          
          EXPOSE 5432
          EOF
          
          # Launch the Postgres app
          flyctl launch --no-deploy -y
          
          # Create volume for Postgres data
          flyctl volumes create pg_data --size 10 -r lax -y
          
          # Deploy the Postgres app
          flyctl deploy -y

      - name: Configure database connection
        run: |
          echo "Setting up database connection for dev app..."
          # Get the internal hostname for the Postgres app
          DB_HOST="${{ env.FLY_DEV_DB_NAME }}.internal"
          DB_PASSWORD="${{ secrets.DB_PASSWORD || 'postgres' }}"
          
          # Set the DATABASE_URL secret on the main app
          flyctl secrets set \
            DATABASE_URL="postgres://postgres:${DB_PASSWORD}@${DB_HOST}:5432/bennwallet" \
            -a ${{ env.FLY_DEV_APP_NAME }}

      - name: Create development fly.toml
        run: |
          cat > fly.toml << EOF
          app = "${{ env.FLY_DEV_APP_NAME }}"
          primary_region = "sjc"

          [build]
            dockerfile = "Dockerfile"

          [build.args]
            YNAB_API_TOKEN = "${{ secrets.YNAB_API_TOKEN }}"
            YNAB_BUDGET_ID = "${{ secrets.YNAB_BUDGET_ID }}"
            YNAB_ACCOUNT_ID = "${{ secrets.YNAB_ACCOUNT_ID }}"

          [env]
            PORT = "8080"
            NODE_ENV = "development"
            ENVIRONMENT = "development"
            APP_ENV = "development"
            RESET_DB = "true"
            YNAB_API_TOKEN = "${{ secrets.YNAB_API_TOKEN }}"
            YNAB_BUDGET_ID = "${{ secrets.YNAB_BUDGET_ID }}"
            YNAB_ACCOUNT_ID = "${{ secrets.YNAB_ACCOUNT_ID }}"

          [http_service]
            internal_port = 8080
            force_https = true
            auto_stop_machines = true
            auto_start_machines = true
            min_machines_running = 0
            processes = ["app"]

          [[vm]]
            cpu_kind = "shared"
            cpus = 1
            memory_mb = 1024
            
          [[mounts]]
            source = "${{ env.VOLUME_NAME }}"
            destination = "/data"
            
            [mounts.options]
              size = "1"
          EOF

      - name: Check if volume exists and create if needed
        run: |
          if ! flyctl volumes list --app "${{ env.FLY_DEV_APP_NAME }}" | grep -q "${{ env.VOLUME_NAME }}"; then
            echo "Creating volume ${{ env.VOLUME_NAME }}..."
            flyctl volumes create "${{ env.VOLUME_NAME }}" --app "${{ env.FLY_DEV_APP_NAME }}" --region sjc --size 1 -y
          else
            echo "Volume ${{ env.VOLUME_NAME }} already exists"
          fi

      - name: Set Firebase credentials in Fly.io
        run: |
          echo "Setting Firebase credentials in Fly.io secrets..."
          cat > /tmp/firebase-credentials.json << 'EOT'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EOT
          
          flyctl secrets set FIREBASE_SERVICE_ACCOUNT_JSON="$(cat /tmp/firebase-credentials.json)" -a "${{ env.FLY_DEV_APP_NAME }}"
          rm /tmp/firebase-credentials.json

      - name: Deploy to Fly.io Development
        run: |
          echo "Deploying to app: ${{ env.FLY_DEV_APP_NAME }}"
          flyctl deploy --remote-only --app "${{ env.FLY_DEV_APP_NAME }}" -y
        env:
          NODE_ENV: development
          ENVIRONMENT: development
          APP_ENV: development
          RESET_DB: 'true'

      - name: Run database migrations
        run: |
          echo "Running database migrations on development..."
          flyctl ssh console -a ${{ env.FLY_DEV_APP_NAME }} -C "/app/bennwallet migrate"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
