name: Database Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to manage (dev or prod)'
        required: true
        default: 'dev'
      action:
        description: 'Action to perform (migrate, reset, backup)'
        required: true
        default: 'migrate'

env:
  GO_VERSION: '1.24'
  DO_APP_ID_DEV: ${{ secrets.DO_APP_ID_DEV }}
  DO_APP_ID_PROD: ${{ secrets.DO_APP_ID_PROD }}
  DO_DB_ID_DEV: ${{ secrets.DO_DB_ID_DEV }}
  DO_DB_ID_PROD: ${{ secrets.DO_DB_ID_PROD }}
  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

jobs:
  database-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "APP_ID=${{ env.DO_APP_ID_PROD }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_PROD }}" >> $GITHUB_ENV
            echo "ENV=production" >> $GITHUB_ENV
          else
            echo "APP_ID=${{ env.DO_APP_ID_DEV }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_DEV }}" >> $GITHUB_ENV
            echo "ENV=development" >> $GITHUB_ENV
          fi
          
      - name: Get component list and store component name
        run: |
          echo "Getting component list:"
          # Get the raw JSON output and extract the first service name using jq
          COMPONENTS=$(doctl apps get ${{ env.APP_ID }} --output json)
          
          # Install jq for JSON parsing if needed
          sudo apt-get update && sudo apt-get install -y jq
          
          # Extract component name using jq - fix for array structure
          COMPONENT_NAME=$(echo $COMPONENTS | jq -r '.[0].spec.services[0].name')
          echo "COMPONENT_NAME=$COMPONENT_NAME" >> $GITHUB_ENV
          echo "Using component name: $COMPONENT_NAME"
      
      - name: Run migrations
        if: github.event.inputs.action == 'migrate'
        run: |
          echo "Running migrations for ${{ env.ENV }} environment..."
          doctl apps console ${{ env.APP_ID }} ${{ env.COMPONENT_NAME }} "/app/bennwallet migrate"
      
      - name: Reset database
        if: github.event.inputs.action == 'reset' && github.event.inputs.environment == 'dev'
        run: |
          echo "Resetting development database..."
          doctl apps console ${{ env.APP_ID }} ${{ env.COMPONENT_NAME }} "export RESET_DB=true && export APP_ENV=development && /app/bennwallet db-reset && /app/bennwallet migrate"
          echo "Database reset and migrations completed successfully"
      
      - name: Backup database
        if: github.event.inputs.action == 'backup'
        run: |
          echo "Creating database backup for ${{ env.ENV }} environment..."
          doctl databases backup ${{ env.DB_ID }}
          
          # List existing backups
          echo "Existing backups:"
          doctl databases backups list ${{ env.DB_ID }}
      
      - name: Warn about production reset
        if: github.event.inputs.action == 'reset' && github.event.inputs.environment == 'prod'
        run: |
          echo "⚠️ WARNING: Reset action is not allowed on production environment for safety reasons."
          echo "If you really need to reset the production database, please do so manually with extreme caution."
          exit 1 