name: Database Management

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to manage (dev or prod)'
        required: true
        default: 'dev'
      action:
        description: 'Action to perform (reset, backup)'
        required: true
        default: 'backup'

env:
  GO_VERSION: '1.24'
  DO_APP_ID_DEV: ${{ secrets.DO_APP_ID_DEV }}
  DO_APP_ID_PROD: ${{ secrets.DO_APP_ID_PROD }}
  DO_DB_ID_DEV: ${{ secrets.DO_DB_ID_DEV }}
  DO_DB_ID_PROD: ${{ secrets.DO_DB_ID_PROD }}
  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

jobs:
  database-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "APP_ID=${{ env.DO_APP_ID_PROD }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_PROD }}" >> $GITHUB_ENV
            echo "ENV=production" >> $GITHUB_ENV
          else
            echo "APP_ID=${{ env.DO_APP_ID_DEV }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_DEV }}" >> $GITHUB_ENV
            echo "ENV=development" >> $GITHUB_ENV
          fi
      
      - name: Run appropriate database action
        run: |
          if [[ "${{ github.event.inputs.action }}" == "reset" && "${{ github.event.inputs.environment }}" == "dev" ]]; then
            echo "Triggering a reset for development database..."
            echo "This will cause a new deployment with RESET_DB=true"
            doctl apps update ${{ env.APP_ID }} --spec <(echo '{"envs":[{"key":"RESET_DB","value":"true","scope":"RUN_TIME"}]}')
            doctl apps create-deployment ${{ env.APP_ID }} --force-rebuild --wait
            
            # Reset the flag after deployment to prevent continuous resets
            doctl apps update ${{ env.APP_ID }} --spec <(echo '{"envs":[{"key":"RESET_DB","value":"false","scope":"RUN_TIME"}]}')
            echo "Database reset triggered. Migrations will run automatically."
            
          elif [[ "${{ github.event.inputs.action }}" == "backup" ]]; then
            echo "Creating database backup for ${{ env.ENV }} environment..."
            doctl databases backup ${{ env.DB_ID }}
            
            # List existing backups
            echo "Existing backups:"
            doctl databases backups list ${{ env.DB_ID }}
            
          elif [[ "${{ github.event.inputs.action }}" == "reset" && "${{ github.event.inputs.environment }}" == "prod" ]]; then
            echo "⚠️ WARNING: Reset action is not allowed on production environment for safety reasons."
            echo "If you really need to reset the production database, please do so manually with extreme caution."
            exit 1
            
          else
            echo "Unknown action: ${{ github.event.inputs.action }}"
            echo "Available actions: reset (dev only), backup"
            exit 1
          fi 