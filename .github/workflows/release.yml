name: Create Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install semantic-release dependencies
        run: |
          npm install -g semantic-release @semantic-release/github @semantic-release/changelog @semantic-release/git conventional-changelog-conventionalcommits

      - name: Create Release
        id: semantic_release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      
      - name: Check release status
        if: ${{ steps.semantic_release.outcome == 'failure' }}
        run: |
          echo "::warning::Semantic release failed. This could be due to no new releasable commits or a tag conflict."
          echo "::warning::To trigger a new release with a specific version, use the 'Create Clean Release' workflow."
          exit 0 