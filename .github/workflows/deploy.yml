name: Deploy to Production

on:
  push:
    branches: [main]

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  FLY_PROD_APP_NAME: 'bennwallet'
  FLY_PROD_DB_NAME: 'bennwallet-db'
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

permissions:
  contents: read
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci

      - name: Get version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create production .env
        run: |
          echo "VITE_API_URL=https://${{ env.FLY_PROD_APP_NAME }}.fly.dev" > .env

      - name: Build frontend
        env:
          NODE_ENV: production
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.FLY_PROD_APP_NAME }}.fly.dev
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check if prod app exists
        id: check-app
        continue-on-error: true
        run: |
          if flyctl apps list | grep -q "${{ env.FLY_PROD_APP_NAME }}"; then
            echo "APP_EXISTS=true" >> $GITHUB_ENV
          else
            echo "APP_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create prod app if it doesn't exist
        if: env.APP_EXISTS == 'false'
        run: |
          flyctl apps create "${{ env.FLY_PROD_APP_NAME }}" --org personal --non-interactive

      - name: Set Firebase credentials in Fly.io
        run: |
          echo "Setting Firebase credentials in Fly.io secrets..."
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > /tmp/firebase-credentials.json
          if command -v jq &> /dev/null; then
            cat /tmp/firebase-credentials.json | jq . > /tmp/formatted-credentials.json
            flyctl secrets set FIREBASE_SERVICE_ACCOUNT_JSON="$(cat /tmp/formatted-credentials.json)" -a ${{ env.FLY_PROD_APP_NAME }} --yes
            rm /tmp/formatted-credentials.json
          else
            flyctl secrets set FIREBASE_SERVICE_ACCOUNT_JSON="$(cat /tmp/firebase-credentials.json)" -a ${{ env.FLY_PROD_APP_NAME }} --yes
          fi
          rm /tmp/firebase-credentials.json
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # New steps for Managed Postgres setup
      - name: Check if managed Postgres cluster exists
        id: check-db
        continue-on-error: true
        run: |
          if flyctl mpg list --json | jq -e '.[] | select(.name=="${{ env.FLY_PROD_DB_NAME }}")' > /dev/null; then
            echo "DB_EXISTS=true" >> $GITHUB_ENV
            echo "Postgres cluster ${{ env.FLY_PROD_DB_NAME }} exists"
          else
            echo "DB_EXISTS=false" >> $GITHUB_ENV
            echo "Postgres cluster ${{ env.FLY_PROD_DB_NAME }} does not exist"
          fi

      - name: Create managed Postgres cluster if it doesn't exist
        if: env.DB_EXISTS == 'false'
        id: create-db
        run: |
          echo "Creating managed Postgres cluster ${{ env.FLY_PROD_DB_NAME }}..."
          flyctl mpg create --name ${{ env.FLY_PROD_DB_NAME }} --region sjc --password ${{ secrets.DB_PASSWORD }} --plan basic --yes --non-interactive

      - name: Wait for Postgres cluster to be ready
        run: |
          echo "Waiting for Postgres cluster to be ready..."
          for i in {1..15}; do
            echo "Checking DB cluster status (attempt $i)..."
            flyctl mpg list --json > mpg_list.json
            STATUS=$(jq -r '.[] | select(.name=="${{ env.FLY_PROD_DB_NAME }}") | .status' mpg_list.json)
            
            echo "Current status: $STATUS"
            if [ "$STATUS" = "ready" ]; then
              echo "Database cluster is ready."
              exit 0
            fi
            
            echo "Cluster not ready yet (status=$STATUS). Waiting 10 seconds..."
            sleep 10
          done
          echo "Timed out waiting for Postgres cluster readiness." && exit 1

      - name: Attach Postgres to app
        run: |
          echo "Attaching Postgres cluster to app..."
          flyctl mpg attach ${{ env.FLY_PROD_DB_NAME }} --app ${{ env.FLY_PROD_APP_NAME }} --yes

      - name: Check and create required volumes
        id: check-volume
        run: |
          if ! flyctl volumes list --app "${{ env.FLY_PROD_APP_NAME }}" | grep -q "bennwallet_prod_data"; then
            echo "Creating volume for production..."
            flyctl volumes create bennwallet_prod_data --size 1 --app "${{ env.FLY_PROD_APP_NAME }}" --region sjc --yes
          else
            echo "Production volume already exists."
          fi

      - name: Set YNAB secrets
        run: |
          flyctl secrets set \
            YNAB_API_TOKEN="${{ secrets.YNAB_API_TOKEN }}" \
            YNAB_BUDGET_ID="${{ secrets.YNAB_BUDGET_ID }}" \
            YNAB_ACCOUNT_ID="${{ secrets.YNAB_ACCOUNT_ID }}" \
            -a ${{ env.FLY_PROD_APP_NAME }} --yes

      - name: Create fly.toml
        run: |
          cat > fly.toml << EOF
          app = "${{ env.FLY_PROD_APP_NAME }}"
          primary_region = "sjc"

          [build]
            dockerfile = "Dockerfile"

          [build.args]
            # Secrets should be set using fly secrets set, not in this file
            YNAB_ACCOUNT_ID = ""
            YNAB_API_TOKEN = ""
            YNAB_BUDGET_ID = ""

          [env]
            PORT = "8080"
            NODE_ENV = "production"
            ENVIRONMENT = "production"
            # Secrets should be set using fly secrets set, not in this file
            YNAB_ACCOUNT_ID = ""
            YNAB_API_TOKEN = ""
            YNAB_BUDGET_ID = ""

          [http_service]
            internal_port = 8080
            force_https = true
            auto_stop_machines = true
            auto_start_machines = true
            min_machines_running = 1
            processes = ["app"]

          [[vm]]
            cpu_kind = "shared"
            cpus = 1
            memory_mb = 1024
            
          [[mounts]]
            source = "bennwallet_prod_data"
            destination = "/data"
            
            [mounts.options]
              size = "1"
          EOF

      - name: Deploy to Fly.io Production
        run: flyctl deploy --remote-only --app ${{ env.FLY_PROD_APP_NAME }} --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NODE_ENV: production

      - name: Run database migrations
        run: |
          echo "Running database migrations on production..."
          flyctl ssh console -a ${{ env.FLY_PROD_APP_NAME }} -C "/app/bennwallet migrate" --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify migrations
        run: |
          echo "Verifying migrations status..."
          flyctl ssh console -a ${{ env.FLY_PROD_APP_NAME }} -C "/app/bennwallet migrate --dry-run" --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
