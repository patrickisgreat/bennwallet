name: Create Clean Release

on:
  workflow_dispatch:
    inputs:
      initial_version:
        description: 'Starting version number (e.g., 1.4.0)'
        required: true
        default: '1.4.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install semantic-release dependencies
        run: |
          npm install -g semantic-release @semantic-release/github @semantic-release/changelog @semantic-release/git conventional-changelog-conventionalcommits

      - name: Create temporary semantic-release config
        run: |
          echo '{
            "branches": ["main"],
            "tagFormat": "v${version}",
            "plugins": [
              ["@semantic-release/commit-analyzer", {
                "preset": "conventionalcommits",
                "releaseRules": [
                  {"type": "feat", "release": "minor"},
                  {"type": "fix", "release": "patch"},
                  {"type": "docs", "release": "patch"},
                  {"type": "style", "release": "patch"},
                  {"type": "refactor", "release": "patch"},
                  {"type": "perf", "release": "patch"},
                  {"type": "test", "release": "patch"},
                  {"type": "build", "release": "patch"},
                  {"type": "ci", "release": "patch"},
                  {"type": "chore", "scope": "deps", "release": "patch"},
                  {"scope": "breaking", "release": "major"},
                  {"type": "breaking", "release": "major"}
                ]
              }],
              ["@semantic-release/release-notes-generator", {
                "preset": "conventionalcommits",
                "presetConfig": {
                  "types": [
                    {"type": "feat", "section": "Features"},
                    {"type": "fix", "section": "Bug Fixes"},
                    {"type": "docs", "section": "Documentation"},
                    {"type": "style", "section": "Styling"},
                    {"type": "refactor", "section": "Refactors"},
                    {"type": "perf", "section": "Performance"},
                    {"type": "test", "section": "Tests"},
                    {"type": "build", "section": "Build System"},
                    {"type": "ci", "section": "CI/CD"},
                    {"type": "chore", "section": "Chores"}
                  ]
                }
              }],
              ["@semantic-release/changelog", {
                "changelogFile": "CHANGELOG.md"
              }],
              ["@semantic-release/github", {
                "assets": []
              }],
              ["@semantic-release/git", {
                "assets": ["CHANGELOG.md", "package.json"],
                "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
              }]
            ]
          }' > .releaserc-temp.json

      - name: Create Release with specific initial version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL_VERSION: ${{ github.event.inputs.initial_version }}
        run: |
          npx semantic-release --extends .releaserc-temp.json --no-ci 