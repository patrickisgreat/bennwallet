name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  DO_APP_ID_DEV: ${{ secrets.DO_APP_ID_DEV }}
  DO_APP_ID_PROD: ${{ secrets.DO_APP_ID_PROD }}
  DO_DB_ID_DEV: ${{ secrets.DO_DB_ID_DEV }}
  DO_DB_ID_PROD: ${{ secrets.DO_DB_ID_PROD }}
  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bennwallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run backend tests
        run: cd backend && go test -v ./...
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: bennwallet_test
      
      - name: Run frontend tests
        run: npm test
  
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "APP_ID=${{ env.DO_APP_ID_PROD }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_PROD }}" >> $GITHUB_ENV
            echo "ENV=production" >> $GITHUB_ENV
          else
            echo "APP_ID=${{ env.DO_APP_ID_DEV }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_DEV }}" >> $GITHUB_ENV
            echo "ENV=development" >> $GITHUB_ENV
          fi
      
      - name: Get app info
        run: |
          echo "Getting app info:"
          doctl apps get ${{ env.APP_ID }}

      - name: Wait for DO automatic deployment
        run: |
          echo "Waiting for Digital Ocean automatic deployment (triggered by GitHub push)..."
          sleep 60  # Give DO some time to start the deployment
          
          # Create new deployment
          echo "Creating deployment..."
          doctl apps create-deployment ${{ env.APP_ID }} --wait
          
          # Monitor deployment status
          for i in {1..15}; do
            # Get list of all deployments
            DEPLOYMENTS=$(doctl apps list-deployments ${{ env.APP_ID }} --output json)
            echo "Checking deployments..."
            
            # Find the active deployment ID
            ACTIVE_DEPLOYMENT_ID=$(echo $DEPLOYMENTS | jq -r '.[] | select(.phase=="ACTIVE") | .id')
            
            if [[ -z "$ACTIVE_DEPLOYMENT_ID" ]]; then
              echo "No active deployment found yet, waiting..."
              sleep 10
              continue
            fi
            
            echo "Found active deployment: $ACTIVE_DEPLOYMENT_ID"
            
            # Get deployment info
            DEPLOYMENT_INFO=$(doctl apps get-deployment ${{ env.APP_ID }} $ACTIVE_DEPLOYMENT_ID --output json)
            echo "Active deployment info: $DEPLOYMENT_INFO"
            
            # Check progress - fix for array structure
            PROGRESS=$(echo $DEPLOYMENT_INFO | jq -r '.[0].progress.success_steps')
            TOTAL_STEPS=$(echo $DEPLOYMENT_INFO | jq -r '.[0].progress.total_steps')
            PHASE=$(echo $DEPLOYMENT_INFO | jq -r '.[0].phase')
            
            echo "Deployment progress: $PROGRESS/$TOTAL_STEPS, Phase: $PHASE"
            
            if [[ "$PHASE" == "ACTIVE" && "$PROGRESS" == "$TOTAL_STEPS" ]]; then
              echo "Deployment completed successfully!"
              break
            elif [[ "$PHASE" == "ERROR" ]]; then
              echo "Deployment has errors. Getting more details..."
              doctl apps get-deployment ${{ env.APP_ID }} $ACTIVE_DEPLOYMENT_ID --verbose
              exit 1
            fi
            
            if [ $i -eq 15 ]; then
              echo "Waited for 5 minutes, continuing anyway"
            else
              echo "Waiting for deployment... checking again in 20 seconds"
              sleep 20
            fi
          done
      
      - name: Reset and seed dev database
        if: env.ENV == 'development'
        run: |
          echo "Resetting and seeding development database..."
          # We don't need to run migrations or reset the database in CI/CD
          # The application will now handle migrations automatically on startup in development
          echo "Note: Automatic migrations will run during application startup in development environment"

  backup-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Backup development database
        run: |
          echo "Creating development database backup..."
          doctl databases backup ${{ env.DO_DB_ID_DEV }}

  backup-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Backup production database
        run: |
          echo "Creating production database backup..."
          doctl databases backup ${{ env.DO_DB_ID_PROD }} 