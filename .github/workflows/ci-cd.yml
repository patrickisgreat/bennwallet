name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  DO_APP_ID_DEV: ${{ secrets.DO_APP_ID_DEV }}
  DO_APP_ID_PROD: ${{ secrets.DO_APP_ID_PROD }}
  DO_DB_ID_DEV: ${{ secrets.DO_DB_ID_DEV }}
  DO_DB_ID_PROD: ${{ secrets.DO_DB_ID_PROD }}
  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bennwallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run backend tests
        run: cd backend && go test -v ./...
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
          TEST_DB_NAME: bennwallet_test
      
      - name: Run frontend tests
        run: npm test
  
  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Set environment variables
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "APP_ID=${{ env.DO_APP_ID_PROD }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_PROD }}" >> $GITHUB_ENV
            echo "ENV=production" >> $GITHUB_ENV
          else
            echo "APP_ID=${{ env.DO_APP_ID_DEV }}" >> $GITHUB_ENV
            echo "DB_ID=${{ env.DO_DB_ID_DEV }}" >> $GITHUB_ENV
            echo "ENV=development" >> $GITHUB_ENV
          fi
      
      - name: Get app info
        run: |
          echo "Getting app info:"
          doctl apps get ${{ env.APP_ID }}

      - name: Get component list and store component name
        run: |
          echo "Getting component list:"
          # Get the raw JSON output and extract the first service name using jq
          COMPONENTS=$(doctl apps get ${{ env.APP_ID }} --output json)
          echo "Components: $COMPONENTS"
          
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Extract component name using jq
          COMPONENT_NAME=$(echo $COMPONENTS | jq -r '.spec.services[0].name')
          echo "COMPONENT_NAME=$COMPONENT_NAME" >> $GITHUB_ENV
          echo "Using component name: $COMPONENT_NAME"

      - name: Wait for DO automatic deployment
        run: |
          echo "Waiting for Digital Ocean automatic deployment (triggered by GitHub push)..."
          sleep 60  # Give DO some time to start the deployment
          
          # Create new deployment to make sure we have a clean one
          DEPLOYMENT_ID=$(doctl apps create-deployment ${{ env.APP_ID }} --wait --format ID --no-header)
          echo "Created deployment ID: $DEPLOYMENT_ID"
          
          # Now monitor the deployment
          for i in {1..15}; do
            DEPLOYMENTS=$(doctl apps list-deployments ${{ env.APP_ID }})
            echo "Current deployments: $DEPLOYMENTS"
            
            # Check for the latest deployment status
            DEPLOYMENT_INFO=$(doctl apps get-deployment ${{ env.APP_ID }} $DEPLOYMENT_ID)
            echo "Latest deployment info: $DEPLOYMENT_INFO"
            
            # Extract progress using grep
            LATEST_STATUS=$(echo "$DEPLOYMENT_INFO" | grep -o "Progress:.*" || echo "Status not found")
            echo "Latest deployment status: $LATEST_STATUS"
            
            if [[ "$LATEST_STATUS" == *"Progress: 7/7"* ]]; then
              echo "Deployment completed successfully!"
              break
            elif [[ "$LATEST_STATUS" == *"error"* ]]; then
              echo "Deployment has errors. Getting more details..."
              doctl apps get-deployment ${{ env.APP_ID }} $DEPLOYMENT_ID --verbose
              exit 1
            fi
            
            if [ $i -eq 15 ]; then
              echo "Waited for 5 minutes, continuing anyway"
            else
              echo "Waiting for deployment... checking again in 20 seconds"
              sleep 20
            fi
          done
      
      - name: Run database migrations
        run: |
          echo "Running migrations for ${{ env.ENV }} environment..."
          doctl apps console ${{ env.APP_ID }} ${{ env.COMPONENT_NAME }} --command "/app/bennwallet migrate"
      
      - name: Reset and seed dev database
        if: env.ENV == 'development'
        run: |
          echo "Resetting and seeding development database..."
          doctl apps console ${{ env.APP_ID }} ${{ env.COMPONENT_NAME }} --command "export RESET_DB=true && export APP_ENV=development && /app/bennwallet db-reset && /app/bennwallet migrate"

  backup-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Backup development database
        run: |
          echo "Creating development database backup..."
          doctl databases backup ${{ env.DO_DB_ID_DEV }}

  backup-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      
      - name: Backup production database
        run: |
          echo "Creating production database backup..."
          doctl databases backup ${{ env.DO_DB_ID_PROD }} 