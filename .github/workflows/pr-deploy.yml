name: Deploy PR Environment

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  issues: write
  pull-requests: write

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Generate PR app name and volume name
        id: app-name
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          APP_NAME="bennwallet-pr-${PR_NUMBER}"
          DB_NAME="bennwallet-pr-${PR_NUMBER}-db"
          VOLUME_NAME="bennwalletpr${PR_NUMBER}_data"
          echo "APP_NAME=${APP_NAME}" >> $GITHUB_ENV
          echo "DB_NAME=${DB_NAME}" >> $GITHUB_ENV
          echo "VOLUME_NAME=${VOLUME_NAME}" >> $GITHUB_ENV
          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "db_name=${DB_NAME}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          npm ci

      - name: Build frontend
        env:
          VITE_API_URL: 'https://${{ env.APP_NAME }}.fly.dev'
        run: npm run build

      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create fly.toml for the PR app
        run: |
          cat > fly.toml << EOF
          app = "${{ env.APP_NAME }}"
          primary_region = "sjc"

          [build]
            dockerfile = "Dockerfile"

          [build.args]
            YNAB_API_TOKEN = "${{ secrets.YNAB_API_TOKEN }}"
            YNAB_BUDGET_ID = "${{ secrets.YNAB_BUDGET_ID }}"
            YNAB_ACCOUNT_ID = "${{ secrets.YNAB_ACCOUNT_ID }}"

          [env]
            PORT = "8080"
            NODE_ENV = "development"
            APP_ENV = "development"
            PR_DEPLOYMENT = "true"
            RESET_DB = "true"
            PR_NUMBER = "${{ github.event.pull_request.number }}"
            YNAB_API_TOKEN = "${{ secrets.YNAB_API_TOKEN }}"
            YNAB_BUDGET_ID = "${{ secrets.YNAB_BUDGET_ID }}"
            YNAB_ACCOUNT_ID = "${{ secrets.YNAB_ACCOUNT_ID }}"

          [http_service]
            internal_port = 8080
            force_https = true
            auto_stop_machines = true
            auto_start_machines = true
            min_machines_running = 0
            processes = ["app"]

          [[vm]]
            cpu_kind = "shared"
            cpus = 1
            memory_mb = 1024
            
          [[mounts]]
            source = "${{ env.VOLUME_NAME }}"
            destination = "/data"
            
            [mounts.options]
              size = "1"
          EOF

      - name: Debug - Display app name and volume name
        run: |
          echo "APP_NAME: ${{ env.APP_NAME }}"
          echo "DB_NAME: ${{ env.DB_NAME }}"
          echo "VOLUME_NAME: ${{ env.VOLUME_NAME }}"
          cat fly.toml | grep -E 'app|source'

      - name: Check if app exists
        id: check-app
        continue-on-error: true
        run: |
          flyctl apps list | grep "${{ env.APP_NAME }}" || echo "App does not exist yet"
          if flyctl apps list | grep -q "${{ env.APP_NAME }}"; then
            echo "APP_EXISTS=true" >> $GITHUB_ENV
          else
            echo "APP_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create app if it doesn't exist
        if: env.APP_EXISTS == 'false'
        run: |
          flyctl apps create "${{ env.APP_NAME }}" --org personal

      # Set up PostgreSQL using a regular Fly app with Docker
      - name: Check if Postgres app exists
        id: check-db
        continue-on-error: true
        run: |
          if flyctl apps list | grep -q "${{ env.DB_NAME }}"; then
            echo "DB_EXISTS=true" >> $GITHUB_ENV
            echo "Postgres app ${{ env.DB_NAME }} exists"
          else
            echo "DB_EXISTS=false" >> $GITHUB_ENV
            echo "Postgres app ${{ env.DB_NAME }} does not exist"
          fi

      - name: Create Postgres app if it doesn't exist
        if: env.DB_EXISTS == 'false'
        id: create-db
        run: |
          echo "Creating Postgres app ${{ env.DB_NAME }}..."
          # Create directory for Postgres app
          mkdir -p postgres-app
          cd postgres-app
          
          # Create fly.toml for the Postgres app
          cat > fly.toml << EOF
          app = "${{ env.DB_NAME }}"
          primary_region = "lax"
          
          [env]
            POSTGRES_USER = "postgres"
            POSTGRES_PASSWORD = "${{ secrets.DB_PASSWORD || 'postgres' }}"
            POSTGRES_DB = "bennwallet"
          
          [http_service]
            internal_port = 5432
            force_https = true
            auto_stop_machines = true
            auto_start_machines = true
            min_machines_running = 0
          
          [[vm]]
            memory = "1gb"
            cpu_kind = "shared"
            cpus = 1
          
          [[mounts]]
            source = "pg_data"
            destination = "/var/lib/postgresql/data"
          EOF
          
          # Create Dockerfile for Postgres
          cat > Dockerfile << EOF
          FROM postgres:14-alpine
          
          # Add initialization scripts if needed
          # COPY init.sql /docker-entrypoint-initdb.d/
          
          EXPOSE 5432
          EOF
          
          # Launch the Postgres app
          flyctl launch --no-deploy -y
          
          # Create volume for Postgres data
          flyctl volumes create pg_data --size 10 -r lax -y
          
          # Deploy the Postgres app
          flyctl deploy -y

      - name: Configure database connection
        run: |
          echo "Setting up database connection for PR app..."
          # Get the internal hostname for the Postgres app
          DB_HOST="${{ env.DB_NAME }}.internal"
          DB_PASSWORD="${{ secrets.DB_PASSWORD || 'postgres' }}"
          
          # Set the DATABASE_URL secret on the main app
          flyctl secrets set \
            DATABASE_URL="postgres://postgres:${DB_PASSWORD}@${DB_HOST}:5432/bennwallet" \
            -a ${{ env.APP_NAME }}

      - name: Set Firebase credentials in Fly.io
        run: |
          echo "Setting Firebase credentials in Fly.io secrets for PR environment..."

          # Write the credentials to a file with proper quoting
          # Using heredoc to avoid any shell expansion issues
          cat > /tmp/firebase-credentials.json << 'EOT'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          EOT

          # Set the secret from the file
          flyctl secrets set FIREBASE_SERVICE_ACCOUNT_JSON="$(cat /tmp/firebase-credentials.json)" -a "${{ env.APP_NAME }}"

          # Clean up
          rm /tmp/firebase-credentials.json
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Ensure volume is created (will not recreate if it exists)
        run: |
          if ! flyctl volumes list --app "${{ env.APP_NAME }}" | grep -q "${{ env.VOLUME_NAME }}"; then
            echo "Creating volume ${{ env.VOLUME_NAME }}..."
            flyctl volumes create "${{ env.VOLUME_NAME }}" --app "${{ env.APP_NAME }}" --region sjc --size 1 -y
          else
            echo "Volume ${{ env.VOLUME_NAME }} already exists"
          fi

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --app "${{ env.APP_NAME }}" -y
        env:
          NODE_ENV: development
          APP_ENV: development
          PR_DEPLOYMENT: 'true'
          RESET_DB: 'true'

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 PR environment deployed to https://${{ env.APP_NAME }}.fly.dev

            This environment will be automatically destroyed when the PR is closed.`
            })
