name: Setup Database Backups

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # Runs at 3 AM UTC every day
  push:
    paths:
      - '.github/workflows/setup-backups.yml'
    branches:
      - main

env:
  DO_DB_ID_PROD: ${{ secrets.DO_DB_ID_PROD }}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          
      - name: Create database backup
        run: |
          echo "Creating backup of production database..."
          doctl databases backup ${{ env.DO_DB_ID_PROD }}
          
          # List existing backups
          echo "Existing backups:"
          doctl databases backups list ${{ env.DO_DB_ID_PROD }}
          
      - name: Backup status
        run: |
          echo "Backup created successfully."
          echo "Digital Ocean retains database backups according to the following schedule:"
          echo "- Hourly backups: 24 hours"
          echo "- Daily backups: 7 days"
          echo "- Weekly backups: 4 weeks"
          echo "- Monthly backups: 12 months"
